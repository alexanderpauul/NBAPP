<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Background */
        .background {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
                radial-gradient(circle at center, #333 0%, #111 70%);
            z-index: -2;
        }

        /* Animated warning stripes */
        .stripes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: repeating-linear-gradient(
                -45deg,
                #f5b400 0px,
                #f5b400 25px,
                #111 25px,
                #111 50px
            );
            animation: moveStripes 2s linear infinite;
        }

        .stripes.bottom {
            top: auto;
            bottom: 0;
        }

        @keyframes moveStripes {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 50px 0;
            }
        }

        /* Main card */
        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 50px 30px;
        }

        /* Icon */
        .construction-icon {
            font-size: 80px;
            margin-bottom: 25px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-12px) rotate(5deg);
            }
        }

        h1 {
            font-size: clamp(42px, 8vw, 75px);
            font-weight: 900;
            letter-spacing: -3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 span {
            color: #f5b400;
        }

        .subtitle {
            color: #aaa;
            font-size: 18px;
            line-height: 1.6;
            max-width: 550px;
            margin: 0 auto 35px;
        }

        /* Progress */
        .progress-section {
            max-width: 500px;
            margin: 0 auto 35px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #292929;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 72%;
            background: #f5b400;
            border-radius: 20px;
            animation: progressGlow 2s infinite alternate;
        }

        @keyframes progressGlow {
            from {
                box-shadow: 0 0 5px rgba(245,180,0,0.3);
            }

            to {
                box-shadow: 0 0 20px rgba(245,180,0,0.7);
            }
        }

        /* Button */
        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #f5b400;
            color: #111;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(245,180,0,0.25);
        }

        /* Socials */
        .socials {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .social {
            width: 42px;
            height: 42px;
            border: 1px solid #444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            text-decoration: none;
            transition: 0.3s;
        }

        .social:hover {
            color: #f5b400;
            border-color: #f5b400;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 45px;
            color: #555;
            font-size: 13px;
        }

        /* Mobile */
        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            .construction-icon {
                font-size: 60px;
            }

            .subtitle {
                font-size: 16px;
            }

            h1 {
                letter-spacing: -2px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <div class="stripes"></div>
    <div class="stripes bottom"></div>

    <main class="container">

        <div class="construction-icon">
            🚧
        </div>

        <h1>
            Under <span>Construction</span>
        </h1>

        <p class="subtitle">
            We're currently working on something awesome.
            Our website is getting a fresh new look and will be
            ready very soon.
        </p>

        <div class="progress-section">

            <div class="progress-info">
                <span>Development Progress</span>
                <span>72%</span>
            </div>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

        </div>

        <a href="index.html" class="button">
            Go back to Home page
        </a>

        <div class="socials">

            <a href="#" class="social">𝕏</a>
            <a href="#" class="social">f</a>
            <a href="#" class="social">in</a>
            <a href="#" class="social">◎</a>

        </div>

        <footer>
            © 2026 Your Website. All rights reserved.
        </footer>

    </main>

</body>
</html>
